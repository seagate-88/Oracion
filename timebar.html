<div class="time-bar">
  <!-- Левая часть: дата -->
  <div id="date-block" class="date-block"></div>

  <!-- Центр: текущее время -->
<div class="clock-block">
  <small class="label">Tiempo actual</small>
  <div class="clock-row">
    <span id="current-time" class="big-clock"></span>
    <div id="current-prayer" class="current-prayer"></div>
  </div>
</div>


<!-- Правая часть: Prayer-Block -->
<div id="prayer-counter" class="prayer-counter">

<!-- Блок для обычных намазов -->
<div class="prayer-block" id="prayer-block"></div>

<!-- Отдельный блок для Tahajjud-Block -->
<div class="tahajjud-block" id="tahajjud-block"></div>

</div>
